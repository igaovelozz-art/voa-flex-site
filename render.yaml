# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: voa-flex-site
    runtime: static
    buildCommand: "npm ci --ignore-scripts && npm run render:verify"
    staticPublishPath: ./render-dist
    autoDeployTrigger: checksPass
    previews:
      generation: automatic

    routes:
      - type: redirect
        source: /index.html
        destination: /
      - type: rewrite
        source: /obrigado
        destination: /obrigado/index.html
      - type: rewrite
        source: /privacidade
        destination: /privacidade/index.html
      - type: rewrite
        source: /termos
        destination: /termos/index.html
      - type: rewrite
        source: /404
        destination: /404/index.html

    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'sha256-KTzkIpo0WGU/iP95jvYe+Bk5T/WDxon4tq/nIwQrhzw='; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://viacep.com.br; form-action 'self'; manifest-src 'self'; media-src 'self'; worker-src 'self'; upgrade-insecure-requests"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=86400, stale-while-revalidate=604800"
      - path: /app.js
        name: Cache-Control
        value: "public, max-age=3600, must-revalidate"
      - path: /obrigado.js
        name: Cache-Control
        value: "public, max-age=3600, must-revalidate"
      - path: /styles.css
        name: Cache-Control
        value: "public, max-age=3600, must-revalidate"
      - path: /premium.css
        name: Cache-Control
        value: "public, max-age=3600, must-revalidate"
      - path: /health.json
        name: Cache-Control
        value: "no-store"
